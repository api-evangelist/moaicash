name: Moai.cash
description: >-
  Moai.cash is a Telegram-native cryptocurrency super app operated by Sloika
  Industries, Inc. that bundles digital-wallet, payments, and Web3 financial
  services into a familiar messaging interface. It advertises zero-fee
  transactions, support for 1,000+ tokens, multi-chain deposits, token swapping,
  peer-to-peer money transfers, prediction markets for real-world events, and an
  on-chain lottery (Megapot). The company promotes an embedded-apps "API" that
  lets third-party applications run inside the Moai experience (payment
  processing, wallet management, token operations, lending/borrowing, real-world
  assets, Web3 gaming, and tokenized stocks), but that API is gated behind an
  email access request with no public documentation, OpenAPI specification, base
  URL, or self-service developer portal at this time. Surfaced as a portfolio
  company of Point Nine and tracked in the API Evangelist network.
